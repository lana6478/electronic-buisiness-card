<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Wiring - ESP32-C3 SuperMini [XIAO pins in brackets]</text>

  <!-- TFT -->
  <rect x="30" y="70" width="230" height="300" rx="10" fill="#1d3557"/>
  <rect x="55" y="140" width="180" height="210" rx="18" fill="#a8dadc"/>
  <text x="145" y="250" text-anchor="middle" fill="#1d3557" font-weight="bold">1.69" ST7789</text>
  <text x="145" y="270" text-anchor="middle" fill="#1d3557">240 x 280 SPI</text>

  <!-- MCU -->
  <rect x="360" y="150" width="180" height="260" rx="10" fill="#2a2a2a"/>
  <rect x="420" y="135" width="60" height="25" rx="5" fill="#999"/>
  <text x="450" y="152" text-anchor="middle" font-size="11">USB-C</text>
  <text x="450" y="285" text-anchor="middle" fill="#fff" font-weight="bold">ESP32-C3</text>
  <text x="450" y="303" text-anchor="middle" fill="#ccc" font-size="12">SuperMini / XIAO</text>

  <!-- OLED -->
  <rect x="650" y="70" width="220" height="190" rx="10" fill="#1d3557"/>
  <rect x="670" y="110" width="180" height="22" fill="#ffd60a"/>
  <rect x="670" y="132" width="180" height="70" fill="#4cc9f0"/>
  <text x="760" y="226" text-anchor="middle" fill="#fff" font-weight="bold">0.96" SSD1306</text>
  <text x="760" y="244" text-anchor="middle" fill="#fff">128 x 64 I2C</text>

  <!-- Wires: label lines -->
  <g stroke-width="3" fill="none">
    <!-- TFT -->
    <path d="M260 100 H330 V390 H360" stroke="#000"/>
    <path d="M260 130 H320 V380 H360" stroke="#e63946"/>
    <path d="M260 160 H360" stroke="#f4a261"/>
    <path d="M260 190 H360" stroke="#2a9d8f"/>
    <path d="M260 220 H360" stroke="#8338ec"/>
    <path d="M260 250 H360" stroke="#3a86ff"/>
    <path d="M260 280 H310 V330 H360" stroke="#ff006e"/>
    <path d="M260 310 H300 V350 H360" stroke="#6c757d"/>
    <!-- OLED -->
    <path d="M650 100 H580 V390 H540" stroke="#000"/>
    <path d="M650 130 H570 V380 H540" stroke="#e63946"/>
    <path d="M650 160 H600 V200 H540" stroke="#06d6a0"/>
    <path d="M650 190 H610 V230 H540" stroke="#118ab2"/>
  </g>

  <g font-size="12" fill="#222">
    <text x="265" y="96">GND</text>
    <text x="265" y="126">VCC</text>
    <text x="265" y="156">SCL</text>
    <text x="265" y="186">SDA</text>
    <text x="265" y="216">RES</text>
    <text x="265" y="246">DC</text>
    <text x="265" y="276">CS</text>
    <text x="265" y="306">BLK</text>

    <text x="368" y="164" fill="#fff">GPIO4 [D8]</text>
    <text x="368" y="194" fill="#fff">GPIO6 [D10]</text>
    <text x="368" y="224" fill="#fff">GPIO1 [D0]</text>
    <text x="368" y="254" fill="#fff">GPIO10 [D1]</text>
    <text x="368" y="334" fill="#fff">GPIO7 [D2]</text>
    <text x="368" y="354" fill="#fff">GPIO3 [D3]</text>
    <text x="368" y="384" fill="#fff">3V3</text>
    <text x="368" y="400" fill="#fff">GND</text>

    <text x="612" y="96">GND</text>
    <text x="612" y="126">VCC</text>
    <text x="612" y="156">SCL</text>
    <text x="612" y="186">SDA</text>
    <text x="532" y="204" text-anchor="end" fill="#fff">GPIO9 [D5]</text>
    <text x="532" y="234" text-anchor="end" fill="#fff">GPIO8 [D4]</text>
  </g>


  <!-- Button -->
  <path d="M540 260 H620 V470" stroke="#fb8500" stroke-width="3" fill="none"/>
  <text x="532" y="264" text-anchor="end" font-size="12" fill="#fff">GPIO5 [D7]</text>
  <rect x="590" y="470" width="60" height="60" rx="6" fill="#444"/>
  <circle cx="620" cy="500" r="18" fill="#e63946"/>
  <path d="M650 500 H700 V390 H580" stroke="#000" stroke-width="3" fill="none"/>
  <text x="708" y="450" font-size="12" fill="#222">GND</text>
  <text x="620" y="550" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Push button</text>
  <text x="620" y="566" text-anchor="middle" font-size="12" fill="#444">tap = next, hold = sleep</text>

  <!-- Battery: LiPo -> TP4056 -> switch -> diode -> 5V -->
  <rect x="20" y="470" width="110" height="60" rx="8" fill="#ffd166" stroke="#222"/>
  <text x="75" y="497" text-anchor="middle" font-weight="bold" fill="#222">3.7V LiPo</text>
  <text x="75" y="514" text-anchor="middle" font-size="11" fill="#222">250 mAh</text>
  <rect x="160" y="460" width="100" height="80" rx="6" fill="#1d3557"/>
  <text x="210" y="490" text-anchor="middle" font-weight="bold" fill="#fff">TP4056</text>
  <text x="210" y="506" text-anchor="middle" font-size="11" fill="#ddd">USB-C charger</text>
  <text x="166" y="478" font-size="10" fill="#fff">B+</text>
  <text x="166" y="534" font-size="10" fill="#fff">B-</text>
  <text x="254" y="478" text-anchor="end" font-size="10" fill="#fff">OUT+</text>
  <text x="254" y="534" text-anchor="end" font-size="10" fill="#fff">OUT-</text>
  <path d="M130 480 H160" stroke="#e63946" stroke-width="3"/>
  <path d="M130 520 H160" stroke="#000" stroke-width="3"/>
  <rect x="280" y="463" width="36" height="20" rx="3" fill="#666"/>
  <rect x="287" y="457" width="9" height="9" fill="#222"/>
  <text x="298" y="500" text-anchor="middle" font-size="11" fill="#222">switch</text>
  <path d="M260 473 H280" stroke="#e63946" stroke-width="3"/>
  <!-- diode -->
  <path d="M316 473 H335" stroke="#e63946" stroke-width="3"/>
  <polygon points="335,463 335,483 352,473" fill="#222"/>
  <rect x="352" y="463" width="3" height="20" fill="#222"/>
  <text x="345" y="500" text-anchor="middle" font-size="11" fill="#222">1N5817</text>
  <path d="M355 473 H390 V410" stroke="#e63946" stroke-width="3" fill="none"/>
  <text x="384" y="440" text-anchor="end" font-size="12" fill="#222">5V</text>
  <path d="M260 530 H430 V410" stroke="#000" stroke-width="3" fill="none"/>
  <text x="438" y="470" font-size="12" fill="#222">GND</text>
  <text x="250" y="565" text-anchor="middle" font-size="12" fill="#444">Charge by plugging USB-C into the TP4056. XIAO instead: skip TP4056 + diode,</text>
  <text x="250" y="581" text-anchor="middle" font-size="12" fill="#444">LiPo (via switch) goes straight to the BAT+/BAT- pads under the XIAO.</text>
  <text x="450" y="612" text-anchor="middle" font-size="13" fill="#444">Both screens run from 3V3. All grounds are joined. Full pin table: docs/WIRING.md</text>
  <text x="450" y="630" text-anchor="middle" font-size="13" fill="#444">XIAO: same wiring using the [bracketed] pins.</text>
</svg>
